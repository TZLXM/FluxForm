[package]
name = "fluxform-desktop-probe"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[features]
default = ["probe-transparent-orb"]
probe-transparent-orb = []
probe-transparent-window-with-rectangular-hit-region = []
probe-opaque-frameless-fallback = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "=2.12.0", features = ["macos-private-api"] }
tauri-plugin-single-instance = "=2.5.0"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
