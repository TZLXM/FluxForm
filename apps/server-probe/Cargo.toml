[package]
name = "fluxform-server-probe"
version = "0.1.0"
edition.workspace = true
autotests = false

[dependencies]
fluxform-sandbox-probe = { path = "../../crates/fluxform-sandbox-probe" }
http-body-util = "=0.1.5"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"

[[test]]
name = "public_startup"
path = "tests/public_startup.rs"

[[test]]
name = "upload_ledger"
path = "tests/upload_ledger.rs"
