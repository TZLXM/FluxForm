[workspace]
members = [
    "crates/fluxform-protocol",
    "crates/fluxform-ffmpeg-profile",
    "crates/fluxform-capabilities",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
